<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <title>RadioMax, una experiencia inmersiva</title>
    <meta name="description" content="RadioMax, disfruta de una experiencia inmersiva con la mejor música las 24 horas. ¡Escucha gratis ahora!">
    <meta name="keywords" content="radio online, música streaming, SomaFM, Radio Paradise, escuchar música gratis, radio inmersiva">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#000000">
    <meta name="author" content="RadioMax">
    
    <!-- Preconnect a dominios críticos -->
    <link rel="preconnect" href="https://core.chcs.workers.dev" crossorigin>
    <link rel="preconnect" href="https://i.scdn.co" crossorigin>
    <link rel="preconnect" href="https://api.somafm.com" crossorigin>
    <link rel="dns-prefetch" href="https://musicbrainz.org">
    
    <link rel="manifest" href="/site.webmanifest">
    <link rel="canonical" href="https://radiomax.tramax.com.ar/">
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="icon" href="/images/favicon.ico" sizes="any">    
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RadioMax">
    <!-- Open Graph -->
    <meta property="og:title" content="RadioMax, una experiencia inmersiva">
    <meta property="og:description" content="RadioMax, disfruta de una experiencia inmersiva con la mejor música las 24 horas. ¡Escucha gratis ahora!">
    <meta property="og:image" content="https://radiomax.tramax.com.ar/images/radiomax-social-card-1200x630.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Logo de RadioMax - Experiencia inmersiva de radio online">
    <meta property="og:url" content="https://radiomax.tramax.com.ar/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="RadioMax">
    <meta property="og:locale" content="es_ES">
    <meta property="og:locale:alternate" content="es_AR">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@RadioMax">
    <meta name="twitter:title" content="RadioMax, una experiencia inmersiva">
    <meta name="twitter:description" content="RadioMax, disfruta de una experiencia inmersiva con la mejor música las 24 horas. ¡Escucha gratis ahora!">
    <meta name="twitter:image" content="https://radiomax.tramax.com.ar/images/radiomax-social-card-1200x630.jpg">
    <meta name="twitter:image:alt" content="Logo de RadioMax">
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "RadioMax",
        "alternateName": "RadioMax, una experiencia inmersiva",
        "url": "https://radiomax.tramax.com.ar/",
        "description": "RadioMax, disfruta de una experiencia inmersiva con la mejor música las 24 horas. ¡Escucha gratis ahora!",
        "inLanguage": "es",
        "potentialAction": {
            "@type": "ListenAction",
            "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://radiomax.tramax.com.ar/",
                "inLanguage": "es",
                "actionPlatform": [
                    "https://schema.org/DesktopWebPlatform",
                    "https://schema.org/MobileWebPlatform"
                ]
            }
        },
        "publisher": {
            "@type": "Organization",
            "name": "RadioMax",
            "logo": {
                "@type": "ImageObject",
                "url": "https://radiomax.tramax.com.ar/images/favicon-96x96.png"
            }
        }
    }
    </script>
    <link rel="stylesheet" href="/css/styles.css">
    
</head>
<body>
    <!-- Skip link para accesibilidad -->
    <a href="#stationSelect" class="skip-link">Saltar al selector de estaciones</a>
    <div class="player-container">
        <div class="player-header">
            
            <h1 id="stationName" class="station-name">RadioMax</h1>
            
            <button id="filterToggleStar" 
                    class="filter-toggle-star" 
                    aria-label="Mostrar solo estaciones favoritas"
                    aria-pressed="false">
                <svg class="bookmark-frame" viewBox="0 0 24 20" xmlns="http://www.w3.org/2000/svg" 
                     preserveAspectRatio="none" aria-hidden="true" focusable="false">
                    <path d="M6 0 V20 L12 15 L18 20 V0 Z" />
                </svg>
            </button>
            
        </div>
               
        <div class="station-selector">
            
            <div class="loading-stations" id="loadingStations" aria-live="polite" aria-atomic="true">
                Cargando estaciones de radio...
            </div>
            
            <label for="stationSelect" class="visually-hidden">Seleccionar estación de radio</label>
            <select id="stationSelect" style="display: none;" aria-label="Lista de estaciones disponibles">
                <option value="">Seleccionar estación</option>
            </select>
            
        </div>
        <div class="now-playing-container">
            <div class="album-cover" id="albumCover" role="img" aria-label="Portada del álbum actual">
                <div class="album-cover-placeholder" aria-hidden="true">
                    <!-- Logo RM -->    
                    <svg viewBox="0 0 640 640" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                        <defs>
                            <filter id="glow">
                                <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        <rect width="640" height="640" fill="#0A0A0A" />
                        <g stroke="#333333" stroke-width="2" fill="none">
                            <circle cx="320" cy="320" r="280" />
                            <circle cx="320" cy="320" r="220" />
                            <circle cx="320" cy="320" r="160" />
                        </g>
                        <g transform="translate(320, 320)">
                            <path 
                                d="M -90 -80 L -90 80 C -90 80, -60 100, -30 80 L 30 0 L 90 80 M 90 -80 L 90 80" 
                                stroke="#FF7A00" 
                                stroke-width="20" 
                                stroke-linecap="round" 
                                stroke-linejoin="round" 
                                fill="none"
                                filter="url(#glow)"
                            />
                        </g>
                    </svg>      
                </div>
            </div>
            <div class="now-playing" id="nowPlaying" aria-live="polite" aria-atomic="false">
                <div class="now-playing-header">
                    <div class="now-playing-label" aria-hidden="true">Ahora</div>
                    
                    <button class="share-button" 
                            id="shareButton" 
                            aria-label="Compartir canción actual"
                            aria-expanded="false"
                            aria-haspopup="true"
                            aria-controls="shareOptions">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
                            <path d="M20.52 3.48A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.33.16 11.89c0 2.1.55 4.15 1.6 5.95L0 24l6.3-1.65a11.88 11.88 0 0 0 5.7 1.45c6.55 0 11.89-5.34 11.89-11.9a11.82 11.82 0 0 0-3.48-8.42ZM12 22.13h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.22-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.9 6.99c0 5.45-4.44 9.89-9.89 9.89Z"/>
                        </svg>
                        <span class="share-button-text">COMPARTIR</span>
                        <div class="share-options" id="shareOptions" role="menu" aria-hidden="true" aria-label="Opciones para compartir">
                            <div class="share-option" id="shareWhatsApp" role="menuitem" tabindex="-1">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.149-.67.149-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414-.074-.123-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
                                </svg>
                                <span>WhatsApp</span>
                            </div>
                        </div>
                    </button>
                    
                </div>
                <div class="song-title" id="songTitle" aria-live="polite" aria-atomic="true">a sonar</div>
                <div class="song-artist" id="songArtist" aria-live="polite" aria-atomic="true"></div>
                <div class="song-album" id="songAlbum" aria-live="polite" aria-atomic="true"></div>
            </div>
        </div>
        <div class="countdown-container" id="countdownContainer">
            
            <div id="welcomeScreen" class="welcome-screen" aria-label="Pantalla de bienvenida">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 75" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Logo RadioMax">
                    <g class="layer">
                        <title>RadioMax | una experiencia inmersiva</title>
                        <text 
                            fill="#ff7f00" 
                            stroke="#000000" 
                            stroke-width="0" 
                            text-anchor="middle"
                            dominant-baseline="middle"
                            x="50%" 
                            xml:space="preserve" 
                            y="50%">RadioMax</text>
                    </g>
                </svg>
                <div class="experiencia-inmersiva">Una experiencia inmersiva</div>
                <div class="version-container">                
                    v<span id="version-number">...</span>                    
                </div>
            </div>
            <div id="playbackInfo" 
                 class="playback-info" 
                 style="display: none;" 
                 aria-label="Información de reproducción"
                 role="region">
                <div class="countdown-timer-column">
                    <div class="countdown-label" aria-hidden="true">Restan</div>
                    <div class="countdown-timer" 
                         id="countdownTimer" 
                         aria-live="off"
                         aria-label="Tiempo restante">--:--</div>
                    <div class="total-duration" 
                         id="totalDuration" 
                         aria-label="Duración total de la canción">--:--</div>
                    <!-- timer-separator y track-position-info eliminados -->
                    <div class="detail-row">
                        <span id="trackIsrc" 
                              class="detail-value" 
                              aria-label="Código ISRC de la canción">------------</span>
                    </div>
                </div>
                <div class="album-details-column" role="list" aria-label="Detalles del álbum">
                    <div class="details-row" role="listitem">
                        <span class="details-label" id="label-year">Año</span>
                        <span class="details-value" 
                              id="releaseDate" 
                              aria-labelledby="label-year">----</span>                      
                    </div>
                    <div class="details-row" role="listitem">
                        <span class="details-label" id="label-sello">Sello</span>
                        <span class="details-value" 
                              id="recordLabel" 
                              aria-labelledby="label-sello">----</span>
                    </div>
                    <div class="details-row" role="listitem">
                        <span class="details-label" id="label-tracks">Tracks</span>
                        <span class="details-value" 
                              id="albumTrackCount" 
                              aria-labelledby="label-tracks">--</span>
                    </div>
                    <div class="details-row" role="listitem">
                        <span class="details-label" id="label-tiempo">Tiempo</span>
                        <span class="details-value" 
                              id="albumTotalDuration" 
                              aria-labelledby="label-tiempo">--:--</span>
                    </div>
                    <div class="details-row" role="listitem">
                        <span class="details-label" id="label-genero">Género</span>
                        <span class="details-value genre" 
                              id="trackGenre" 
                              aria-labelledby="label-genero">--</span>
                    </div>
                    <div class="details-row" role="listitem">
                        <span class="details-label" id="label-creditos">Créditos</span>
                        <span id="trackCredits" 
                              class="details-value" 
                              tabindex="0" 
                              role="button"
                              aria-label="Ver créditos de la canción"
                              aria-haspopup="true"
                              aria-expanded="false"
                              aria-controls="tooltip-credits">--</span>
                        <div id="tooltip-credits" 
                             role="tooltip" 
                             aria-hidden="true"
                             aria-live="polite">
                            <div id="tooltip-credits-content"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="controls">
            <button class="btn" id="playBtn" aria-label="Reproducir radio" aria-pressed="false">▶ SONAR</button>
            <button class="btn btn-stop" id="stopBtn" aria-label="Detener reproducción">■ DETENER</button>
        </div>
        <div class="volume-control">
            <label for="volumeSlider" class="visually-hidden">Volumen</label>
            <input type="range" 
                   class="volume-slider" 
                   id="volumeSlider" 
                   min="0" 
                   max="100" 
                   value="50"
                   aria-label="Control de volumen"
                   aria-valuemin="0"
                   aria-valuemax="100"
                   aria-valuenow="50">
            <span class="volume-icon" id="volumeIcon" aria-hidden="true"></span>
        </div>
        <audio id="audioPlayer" aria-label="Reproductor de audio de RadioMax"></audio>
        <div class="current-time" 
             id="currentTime" 
             style="text-align: center; color: #863306; font-size: 12px; margin-top: 12px;" 
             aria-live="off"
             aria-label="Hora actual">
            --:--:-- (GMT--)
        </div>
   
    </div>
    <!-- Footer -->
    <footer role="contentinfo">
        
        <div class="footer-column">
            <div id="install-pwa-container">
                <button type="button" 
                        id="install-pwa-btn-android" 
                        class="install-btn" 
                        title="Instalar Aplicación en Android"
                        aria-label="Instalar RadioMax como aplicación en Android">
                    <span>Instalar</span>
                </button>
                <button type="button" 
                        id="install-pwa-btn-ios" 
                        class="install-btn" 
                        title="Añadir a pantalla de inicio en iOS"
                        aria-label="Añadir RadioMax a la pantalla de inicio en iOS">
                    <span>iOS</span>
                </button>
            </div>
        </div>
        <div class="footer-column">
        </div>
    </footer>
    <!-- Update notification -->
    <div id="update-notification" style="display: none;" role="alert" aria-live="assertive" aria-atomic="true">
        Nueva versión disponible <button id="update-reload-btn">Actualizar</button>
    </div>
    <!-- PWA invitation -->
    <div id="install-pwa-invitation" 
         style="display: none;" 
         role="dialog" 
         aria-labelledby="invitation-title" 
         aria-modal="true">
        <button id="close-invitation" 
                class="close-btn" 
                aria-label="Cerrar ventana de instalación">&times;</button>
        <div class="invitation-text" id="invitation-title">Mejora tu experiencia</div>
        <div class="invitation-logos">
            <button type="button" 
                    id="install-windows" 
                    class="install-logo-btn" 
                    title="Instalar app oficial para Windows"
                    aria-label="Instalar RadioMax en Windows">
                Windows
            </button>
            <button type="button" 
                    id="install-android" 
                    class="install-logo-btn" 
                    title="Instalar app oficial para Android"
                    aria-label="Instalar RadioMax en Android">
                Android
            </button>
            <button type="button" 
                    id="install-ios" 
                    class="install-logo-btn" 
                    title="Instalar app oficial para iOS"
                    aria-label="Instalar RadioMax en iOS">
                iOS
            </button>
        </div>
    </div>
      
    <script type="module" src="/scripts/app.js" defer></script>
    
    <div id="notification" class="notification" role="status" aria-live="polite" aria-atomic="true"></div>
    
</body>
</html>
